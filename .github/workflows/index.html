<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GtxDual</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 500px;
            width: 100%;
        }

        .logo {
            font-size: 3em;
            font-weight: 800;
            background: linear-gradient(90deg, #00d4ff, #9b59b6, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            margin-bottom: 10px;
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 5px #00d4ff); }
            to { filter: drop-shadow(0 0 20px #9b59b6); }
        }

        .subtitle {
            color: #b8b8d1;
            margin-bottom: 40px;
            font-size: 1em;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 18px 25px;
            border-radius: 15px;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: 600;
            color: #fff;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
        }

        .link-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            background: rgba(255, 255, 255, 0.15);
        }

        .link-btn .icon {
            font-size: 1.5em;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }

        .stream .icon { background: linear-gradient(135deg, #6441a5, #9b59b6); }
        .telegram .icon { background: linear-gradient(135deg, #0088cc, #29b6f6); }
        .whatsapp .icon { background: linear-gradient(135deg, #25d366, #128c7e); }
        .max .icon { background: linear-gradient(135deg, #ff6b00, #ff9800); }
        .viber .icon { background: linear-gradient(135deg, #7360f2, #9b59b6); }

        .stream:hover { border-color: #9b59b6; }
        .telegram:hover { border-color: #29b6f6; }
        .whatsapp:hover { border-color: #25d366; }
        .max:hover { border-color: #ff9800; }
        .viber:hover { border-color: #7360f2; }

        footer {
            margin-top: 40px;
            color: #6c6c8a;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">GtxDual</div>
        <p class="subtitle"></p>

        <div class="links">
            <a href="https://vt.tiktok.com/ZS9fggy38QFGY-edYDZ/" target="_blank" class="link-btn stream">
                <span class="icon">🎮</span> Смотреть стрим
            </a>
            <a href="https://t.me/+79492785102" target="_blank" class="link-btn telegram">
                <span class="icon">✈️</span> Telegram
            </a>
            <a href="https://wa.me/+79492785102" target="_blank" class="link-btn whatsapp">
                <span class"https://max.ru/+79492785102">💬</span> WhatsApp
            </a>
            <a href="ССЫЛКА_НА_МАКС" target="_blank" class="link-btn max">
                <span class="icon">🟠</span> MAX
            </a>
            <a href="viber://chat?number=ВАШ_НОМЕР" class="link-btn viber">
                <span class="icon">📞</span> Viber
            </a>
        </div>

        <footer>Telegram: @GtxDual .</footer>
    </div>
</body>
</html>
